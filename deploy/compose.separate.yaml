# Generate private .env with: python3 scripts/init-compose.py
# Start behind your HTTPS reverse proxy: docker compose --env-file .env -f deploy/compose.separate.yaml up -d --build
services:
  thura:
    build:
      context: ..
      target: standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://thura:${POSTGRES_PASSWORD:?Run scripts/init-compose.py}@postgres:5432/thura?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/init-compose.py}
      LIDZA_MASTER_KEY: ${LIDZA_MASTER_KEY:?Run scripts/init-compose.py}
      THURA_SETUP_TOKEN: ${THURA_SETUP_TOKEN:-}
      THURA_POSTFIX_TOKEN: ${THURA_POSTFIX_TOKEN:?Run scripts/init-compose.py}
      DB_MIGRATE: "true"
      LIDZA_ADDR: 0.0.0.0:3000
      THURA_PUBLIC_HOSTS: ${THURA_PUBLIC_HOSTS:-}
      THURA_TENANT_SMTP_HOSTS: ${THURA_TENANT_SMTP_HOSTS:-}
      STORAGE_PROVIDER: local
      MAIL_CLAMD_ADDRESS: clamav:3310
      MAIL_RSPAMD_URL: http://127.0.0.1:11333
      MAIL_RSPAMD_CONTROLLER_URL: http://127.0.0.1:11334
      MAIL_RSPAMD_PASSWORD: ${THURA_RSPAMD_PASSWORD:?Add a private Rspamd password using docs/mail-junk.md}
      STORAGE_DIR: storage
      CACHE_URL: redis://valkey:6379/0
      REALTIME_BUS_URL: redis://valkey:6379/1
    ports:
      - "127.0.0.1:${THURA_HTTP_PORT:-8080}:3000"
      # Postfix shares this network namespace. Port 2525 stays private.
      - "${THURA_SMTP_BIND:-0.0.0.0}:${THURA_SMTP_PORT:-25}:25"
    networks: [default, mail-filter-private]
    volumes:
      - thura-storage:/app/storage
  postfix:
    build: ./postfix
    restart: unless-stopped
    stop_grace_period: 40s
    cpus: 1.75
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      thura:
        condition: service_started
        restart: true
      mail-filter-cache:
        condition: service_healthy
    network_mode: service:thura
    environment:
      THURA_POSTFIX_MANAGED: "true"
      MAIL_RSPAMD_PASSWORD: ${THURA_RSPAMD_PASSWORD:?Add a private Rspamd password using docs/mail-junk.md}
      THURA_POSTFIX_TOKEN: ${THURA_POSTFIX_TOKEN:?Run scripts/init-compose.py}
    volumes:
      - postfix-queue:/var/spool/postfix
      - rspamd-state:/var/lib/rspamd
      # Optional smtp-cert.pem and smtp-key.pem; private key remains read-only.
      - ${SMTP_TLS_DIR:-./private/smtp}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python3", "/opt/thura/supervise.py", "--health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
  postgres:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    environment:
      POSTGRES_DB: thura
      POSTGRES_USER: thura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-compose.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thura -d thura"]
      interval: 5s
      timeout: 5s
      retries: 20
  valkey:
    image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  clamav:
    build: ./clamav
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    # Private service only: no published ports or mail-storage mounts.
    healthcheck:
      test: ["CMD-SHELL", "printf 'zPING\\0' | nc -w 3 127.0.0.1 3310 | tr -d '\\000' | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
  mail-filter-cache:
    image: valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    networks: [mail-filter-private]
    volumes:
      - mail-filter-learning:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  storage-init:
    image: busybox:1.37.0
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 65532:65532 /storage && chmod 0700 /storage"]
    volumes:
      - thura-storage:/storage
volumes:
  postgres-data:
  valkey-data:
  thura-storage:
  postfix-queue:
  clamav-signatures:
  rspamd-state:
  mail-filter-learning:
networks:
  mail-filter-private:
    internal: true
