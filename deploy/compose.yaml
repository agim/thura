# Compact small-team deployment: four containers, 3.5 GiB limits + 512 MiB host.
# Generate private .env with scripts/init-compose.py; see docs/compact-deployment.md.
services:
  thura:
    build:
      context: ..
      target: compact
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 1024m
    memswap_limit: 1024m
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://thura:${POSTGRES_PASSWORD:?Run scripts/init-compose.py}@postgres:5432/thura?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/init-compose.py}
      LIDZA_MASTER_KEY: ${LIDZA_MASTER_KEY:?Run scripts/init-compose.py}
      THURA_SETUP_TOKEN: ${THURA_SETUP_TOKEN:?Run scripts/init-compose.py}
      THURA_POSTFIX_TOKEN: ${THURA_POSTFIX_TOKEN:?Run scripts/init-compose.py}
      DB_MIGRATE: "true"
      DB_MAX_CONNS: "8"
      LIDZA_ADDR: 0.0.0.0:3000
      THURA_PUBLIC_HOSTS: thura,${THURA_PUBLIC_HOSTS:-}
      THURA_SERVICE_HTTP_ORIGINS: http://127.0.0.1:7880,http://collabora:9980,http://thura:3000,http://127.0.0.1:8008
      THURA_MANAGED_MATRIX: "true"
      THURA_MANAGED_OLLAMA: "true"
      THURA_SERVICE_MATRIX_SERVER_NAME: ${APP_DOMAIN:?Set the public Thura domain}
      THURA_SERVICE_MATRIX_SERVER_URL: http://127.0.0.1:8008
      THURA_SERVICE_MATRIX_AS_TOKEN: ${MATRIX_AS_TOKEN:?Run scripts/init-compose.py --upgrade-compact}
      THURA_SERVICE_MATRIX_HS_TOKEN: ${MATRIX_HS_TOKEN:?Run scripts/init-compose.py --upgrade-compact}
      THURA_MANAGED_SETTINGS: MATRIX_SERVER_URL,MATRIX_SERVER_NAME,MATRIX_AS_TOKEN,COLLABORA_SERVER_URL,COLLABORA_APP_URL,COLLABORA_TOKEN_SECRET,LIVEKIT_SERVER_URL,LIVEKIT_PUBLIC_URL,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,MAIL_RSPAMD_URL,MAIL_RSPAMD_CONTROLLER_URL,MAIL_RSPAMD_PASSWORD,MAIL_CLAMD_ADDRESS
      THURA_TENANT_SMTP_HOSTS: ${THURA_TENANT_SMTP_HOSTS:-}
      STORAGE_DIR: /app/storage
      MAIL_CLAMD_ADDRESS: 127.0.0.1:3310
      MAIL_RSPAMD_URL: http://127.0.0.1:11333
      MAIL_RSPAMD_CONTROLLER_URL: http://127.0.0.1:11334
      MAIL_RSPAMD_PASSWORD: ${THURA_RSPAMD_PASSWORD:?Run scripts/init-compose.py --upgrade-mail}
      CACHE_URL: redis://127.0.0.1:6379/1
      REALTIME_BUS_URL: redis://127.0.0.1:6379/2
      LIVEKIT_SERVER_URL: http://127.0.0.1:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Run scripts/init-compose.py --upgrade-compact}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Run scripts/init-compose.py --upgrade-compact}
      THURA_RTC_NODE_IP: ${THURA_RTC_NODE_IP:-}
      COLLABORA_SERVER_URL: http://collabora:9980
      COLLABORA_APP_URL: ${THURA_WOPI_ORIGIN:-http://thura:3000}
      COLLABORA_TOKEN_SECRET: ${COLLABORA_TOKEN_SECRET:?Run scripts/init-compose.py --upgrade-compact}
    ports:
      - "127.0.0.1:${THURA_HTTP_PORT:-8080}:3000"
      - "${THURA_SMTP_BIND:-0.0.0.0}:${THURA_SMTP_PORT:-25}:25"
      - "127.0.0.1:${THURA_MEET_HTTP_PORT:-7880}:7880"
      - "${THURA_RTC_BIND:-0.0.0.0}:7881:7881"
      - "${THURA_RTC_BIND:-0.0.0.0}:7882:7882/udp"
    volumes:
      - thura-storage:/app/storage
      - matrix-state:/app/matrix
      - model-state:/app/models
    healthcheck:
      test: ["CMD", "python3", "/opt/thura/app.py", "--health"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 45s
  postfix:
    build:
      context: ..
      dockerfile: deploy/compact/mail.Dockerfile
    restart: unless-stopped
    stop_grace_period: 50s
    cpus: 0.50
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      thura:
        condition: service_started
        restart: true
    network_mode: service:thura
    environment:
      THURA_POSTFIX_MANAGED: "true"
      MAIL_RSPAMD_PASSWORD: ${THURA_RSPAMD_PASSWORD:?Run scripts/init-compose.py --upgrade-mail}
      THURA_POSTFIX_TOKEN: ${THURA_POSTFIX_TOKEN:?Run scripts/init-compose.py}
    volumes:
      - postfix-queue:/var/spool/postfix
      - rspamd-state:/var/lib/rspamd
      - clamav-signatures:/var/lib/clamav
      - mail-filter-learning:/var/lib/thura-valkey
      - ${SMTP_TLS_DIR:-./private/smtp}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python3", "/opt/thura/compact.py", "--health"]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 300s
  postgres:
    image: postgres:17
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_DB: thura
      POSTGRES_USER: thura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-compose.py}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=40"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thura -d thura"]
      interval: 5s
      timeout: 5s
      retries: 20
  collabora:
    image: ${COLLABORA_IMAGE:-thura-office:local}
    build:
      context: ..
      dockerfile: deploy/compact/office.Dockerfile
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      - "127.0.0.1:${THURA_OFFICE_PORT:-8091}:9980"
    command:
      - --o:ssl.enable=false
      - --o:ssl.termination=true
      - --o:net.service_root=/api/v1/collabora
      - --o:storage.wopi.alias_groups[@mode]=groups
      - --o:storage.wopi.alias_groups.group[0].host=${THURA_WOPI_ORIGIN:-http://thura:3000}
      - --o:storage.wopi.alias_groups.group[0].host[@allow]=true
      - --o:admin_console.enable=false
      - --o:logging.level=warning
      - --o:num_prespawn_children=1
      - --o:per_document.max_concurrency=1
    healthcheck:
      test: ["CMD", "/usr/local/bin/thura-office-health"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s
volumes:
  model-state:
  matrix-state:
  postgres-data:
  thura-storage:
  postfix-queue:
  clamav-signatures:
  rspamd-state:
  mail-filter-learning:
