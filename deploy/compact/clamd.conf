Foreground yes
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
ScanMail yes
ScanArchive yes
AlertExceedsMax yes
AlertEncrypted yes
MaxScanTime 10000
MaxFileSize 12M
MaxScanSize 50M
MaxRecursion 8
MaxFiles 512
StreamMaxLength 20M
MaxThreads 1
MaxQueue 2
ConcurrentDatabaseReload no
ReadTimeout 20
CommandReadTimeout 5
SelfCheck 600
PhishingSignatures yes
PhishingScanURLs yes
