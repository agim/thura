backend = "redis";
new_schema = true;
autolearn = false;
min_learns = 200;
per_user = <<EOD
return function(task)
  local team = task:get_request_header('X-Thura-Workspace')
  if team then team = tostring(team) end
  if team and string.match(team, '^[%x%-]+$') and #team == 36 then
    return 'thura-team:' .. team
  end
  return 'thura-unscoped'
end
EOD;
